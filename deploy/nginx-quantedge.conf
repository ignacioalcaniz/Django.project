server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    access_log /var/log/nginx/quantedge_access.log;
    error_log /var/log/nginx/quantedge_error.log;

    location /static/ {
        alias /srv/quantedge/app/staticfiles/;
        autoindex off;
    }

    location /media/ {
        alias /srv/quantedge/app/media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Preserve the external port (e.g. Windows NAT on 8080) for SEO and CSRF.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
}
